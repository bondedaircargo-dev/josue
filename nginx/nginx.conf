upstream vortex_app {
    server app:3000;
}

upstream vortex_n8n {
    server n8n:5678;
}

# ── API Principal ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;                # Cambia _ por tu dominio: api.tuempresa.com

    client_max_body_size 20M;

    # Health check rápido
    location /health {
        proxy_pass http://vortex_app/dashboard/health;
        proxy_set_header Host $host;
    }

    # API principal
    location / {
        proxy_pass http://vortex_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── n8n Automatizaciones ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name n8n.tudominio.com;   # Cambia por tu subdominio de n8n

    location / {
        proxy_pass http://vortex_n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }
}
