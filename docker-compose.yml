version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# VORTEX GROUP — AI OPERATIONS SYSTEM
# Levanta TODO el stack con: docker compose up -d
#
# Servicios:
#   app      → Node.js API en puerto 3000
#   n8n      → Automatizaciones en puerto 5678
#   postgres → Base de datos en puerto 5432
#   nginx    → Reverse proxy en puerto 80 / 443
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vortex_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vortex}
      POSTGRES_USER: ${POSTGRES_USER:-vortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vortex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vortex_net

  # ── Vortex App (Node.js) ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vortex_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-vortex}:${POSTGRES_PASSWORD:-changeme_secure_password}@postgres:5432/${POSTGRES_DB:-vortex}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/dashboard/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - vortex_net

  # ── n8n (Automatizaciones) ──────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: vortex_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-vortex}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-vortex}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme_n8n}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://${N8N_HOST:-localhost}:5678/
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      # Env vars for workflows
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      PHONE_NUMBER_ID: ${PHONE_NUMBER_ID}
      META_ADS_TOKEN: ${META_ADS_TOKEN}
      GOOGLE_SHEET_SHIPMENTS_ID: ${GOOGLE_SHEET_SHIPMENTS_ID}
      GOOGLE_SHEET_LEADS_ID: ${GOOGLE_SHEET_LEADS_ID}
      GOOGLE_SHEET_MESSAGES_ID: ${GOOGLE_SHEET_MESSAGES_ID}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    networks:
      - vortex_net

  # ── Nginx (Reverse Proxy — opcional, activa si tienes dominio) ──────────────
  nginx:
    image: nginx:alpine
    container_name: vortex_nginx
    restart: unless-stopped
    depends_on:
      - app
      - n8n
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vortex_net
    profiles:
      - with-nginx

volumes:
  postgres_data:
  n8n_data:
  app_logs:

networks:
  vortex_net:
    driver: bridge
